<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ambrosio — fleet</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f6f4; --panel: #fff; --line: #e2e2dd; --ink: #1a1a18; --dim: #6b6b64;
    --working: #1f7a4d; --blocked: #b3730a; --failed: #b02b2b; --idle: #8a8a82;
    --urgent-bg: #fdf0ec; --urgent-line: #e8bfae;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14140f; --panel: #1c1c18; --line: #2e2e28; --ink: #eceae2; --dim: #918f84;
      --working: #5fc38a; --blocked: #e0a83c; --failed: #e5706b; --idle: #6f6f66;
      --urgent-bg: #2b1c18; --urgent-line: #6b3a2c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--mono);
    padding: 20px; max-width: 1200px; margin-inline: auto;
  }
  header { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
  h1 { font-size: 18px; margin: 0; letter-spacing: .06em; text-transform: uppercase; }
  .stats { color: var(--dim); display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; }
  .stats b { color: var(--ink); font-weight: 600; }
  #live { margin-left: auto; font-size: 12px; color: var(--dim); }
  #live.stale { color: var(--failed); }

  h2 { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim);
       margin: 22px 0 8px; font-weight: 600; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }

  .banner { border-color: var(--urgent-line); background: var(--urgent-bg); padding: 10px 12px; margin-bottom: 4px; }
  .banner div + div { margin-top: 4px; }

  .grid { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
  .card { padding: 10px 12px; }
  .card .top { display: flex; align-items: center; gap: 8px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--idle); }
  .working .dot { background: var(--working); animation: pulse 1.8s ease-in-out infinite; }
  .blocked .dot { background: var(--blocked); }
  .failed  .dot { background: var(--failed); }
  @keyframes pulse { 50% { opacity: .35; } }
  .name { font-weight: 600; }
  .state { margin-left: auto; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); }
  .blocked .state { color: var(--blocked); }
  .failed  .state { color: var(--failed); }
  .title { margin-top: 3px; }
  .meta { margin-top: 6px; font-size: 12px; color: var(--dim); display: flex; gap: 12px; flex-wrap: wrap; }
  .detail { margin-top: 6px; font-size: 12px; color: var(--dim); border-left: 2px solid var(--line); padding-left: 8px; }

  .q { padding: 10px 12px; border-bottom: 1px solid var(--line); }
  .q:last-child { border-bottom: 0; }
  .q.urgent { background: var(--urgent-bg); }
  .key { font-weight: 700; }
  .opts { margin-top: 4px; font-size: 12px; color: var(--dim); }
  .tag { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--failed); margin-left: 6px; }

  .answer { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .answer input {
    flex: 1 1 220px; min-width: 0; font: inherit; font-size: 12px; padding: 5px 8px;
    background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 4px;
  }
  .answer input:focus { outline: none; border-color: var(--ink); }
  .answer button {
    font: inherit; font-size: 12px; padding: 5px 11px; cursor: pointer; border-radius: 4px;
    border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  }
  .answer button:hover { border-color: var(--ink); }
  .answer button.send { border-color: var(--working); color: var(--working); font-weight: 600; }
  .answer button:disabled { opacity: .5; cursor: default; }
  .said { margin-top: 6px; font-size: 12px; color: var(--working); }
  .said.bad { color: var(--failed); }

  #stale-banner { border-color: var(--failed); background: var(--urgent-bg); padding: 10px 12px;
                  margin-bottom: 10px; color: var(--failed); }


  /* --- Ambrosio, the butler in the corner ------------------------------- */
  #pet {
    position: fixed; right: 18px; bottom: 18px; z-index: 20;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    user-select: none;
  }
  #bubble {
    font-size: 10px; letter-spacing: .08em; text-transform: uppercase;
    background: var(--panel); border: 1px solid var(--line); color: var(--dim);
    padding: 4px 8px; border-radius: 3px; white-space: nowrap;
    position: relative; opacity: 0; transition: opacity .25s ease;
  }
  #bubble.show { opacity: 1; }
  #bubble::after {                      /* little pixel tail */
    content: ""; position: absolute; left: 50%; margin-left: -3px; bottom: -4px;
    width: 6px; height: 3px; background: var(--panel);
    border-right: 1px solid var(--line); border-bottom: 1px solid var(--line);
  }
  #bubble.attention { color: var(--blocked); border-color: var(--blocked); }
  #bubble.alarm { color: var(--failed); border-color: var(--failed); }

  #screen {
    background: linear-gradient(180deg, var(--panel), var(--bg));
    border: 1px solid var(--line); border-radius: 7px; padding: 5px;
    box-shadow: 0 4px 14px rgba(0,0,0,.14), inset 0 1px 0 rgba(255,255,255,.25);
    cursor: pointer; line-height: 0;
  }
  #screen:hover { border-color: var(--dim); }
  #pet canvas {
    image-rendering: pixelated; image-rendering: crisp-edges;
    width: 192px; height: 120px; display: block; border-radius: 3px;
  }
  @media (max-width: 700px) { #pet { display: none; } }

  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  td { padding: 5px 12px; border-bottom: 1px solid var(--line); }
  tr:last-child td { border-bottom: 0; }
  td.s { color: var(--dim); width: 1%; white-space: nowrap; }
  .empty { padding: 12px; color: var(--dim); font-size: 12px; }

  .card { cursor: pointer; }
  .card:hover { border-color: var(--dim); }
  .card.open { border-color: var(--ink); }

  #drawer[hidden] { display: none; }
  #drawer {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(620px, 100vw);
    background: var(--panel); border-left: 1px solid var(--line);
    display: flex; flex-direction: column; box-shadow: -8px 0 24px rgba(0,0,0,.16); z-index: 10;
  }
  #drawer .head { padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
  #drawer .head .name { font-size: 15px; }
  #drawer .body { overflow-y: auto; padding: 12px 16px 24px; }
  #close { margin-left: auto; background: none; border: 1px solid var(--line); color: var(--ink);
           border-radius: 4px; cursor: pointer; font: inherit; font-size: 12px; padding: 3px 9px; }
  #close:hover { border-color: var(--ink); }
  .sub { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim);
         margin: 16px 0 6px; font-weight: 600; }
  .sub:first-child { margin-top: 0; }
  .box { border: 1px solid var(--line); border-radius: 5px; padding: 9px 11px; font-size: 12px; }
  .box + .box { margin-top: 6px; }

  .ev { display: flex; gap: 8px; padding: 5px 0; border-bottom: 1px solid var(--line); font-size: 12px; }
  .ev:last-child { border-bottom: 0; }
  .ev .ts { flex: none; width: 58px; color: var(--dim); font-size: 11px; padding-top: 1px;
            font-variant-numeric: tabular-nums; }
  .ev .k { flex: none; width: 66px; color: var(--dim); font-size: 11px; text-transform: uppercase;
           letter-spacing: .06em; padding-top: 1px; }
  .gap { color: var(--blocked); font-size: 10px; margin-left: 6px; }
  .since { text-transform: none; letter-spacing: 0; font-weight: 400; }
  .ev .v { white-space: pre-wrap; word-break: break-word; min-width: 0; }
  .ev.tool_use .v { color: var(--ink); }
  .ev.tool_use .k { color: var(--working); }
  .ev.tool_result .v { color: var(--dim); }
  .ev.err .k, .ev.err .v { color: var(--failed); }
  .ev.thinking .v { color: var(--dim); font-style: italic; }
</style>
</head>
<body>
<header>
  <h1>Ambrosio</h1>
  <div class="stats" id="stats"></div>
  <div id="live">connecting…</div>
</header>

<div id="stale"></div>
<div id="anomalies"></div>

<h2>Needs you</h2>
<div class="panel" id="questions"></div>

<h2>Workers</h2>
<div id="workers"></div>

<div id="pet" title="Ambrosio">
  <div id="bubble"></div>
  <div id="screen"><canvas id="pet-canvas" width="48" height="30"></canvas></div>
</div>

<aside id="drawer" hidden>
  <div class="head">
    <span class="dot"></span>
    <span class="name" id="d-name"></span>
    <span class="state" id="d-state"></span>
    <button id="close">close</button>
  </div>
  <div class="body" id="d-body"></div>
</aside>

<h2>Tickets</h2>
<div class="panel" id="tickets"></div>

<script>
const UI_VERSION = "2";        // must match UI_VERSION in src/ui.ts
const answers = {};            // qid -> draft text, kept across re-renders
const said = {};               // qid -> what happened when we sent it
let lastQSig = null;           // questions panel is only rebuilt when it changes

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function ago(ms) {
  if (!ms) return "";
  const s = Math.max(0, Math.floor((Date.now() - ms) / 1000));
  if (s < 60) return s + "s";
  if (s < 3600) return Math.floor(s / 60) + "m";
  return Math.floor(s / 3600) + "h" + String(Math.floor((s % 3600) / 60)).padStart(2, "0");
}

function tokens(n) {
  if (!n) return "";
  return n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : Math.round(n / 1000) + "k";
}

function render(d) {
  $("stats").innerHTML =
    `<span>wip <b>${d.wip.used}/${d.wip.limit}</b></span>` +
    `<span>workers <b>${d.workers.length}</b></span>` +
    `<span>open questions <b>${d.questions.length}</b></span>` +
    (d.tokensToday ? `<span>today <b>${tokens(d.tokensToday)}</b></span>` : "");

  $("anomalies").innerHTML = d.anomalies.length
    ? `<div class="panel banner">${d.anomalies.map((a) => `<div>! ${esc(a)}</div>`).join("")}</div>`
    : "";

  const qSig = JSON.stringify(d.questions.map((q) => [q.qid, q.summary, q.urgent, q.options]));
  if (qSig !== lastQSig) {
    lastQSig = qSig;
    $("questions").innerHTML = d.questions.length
    ? d.questions.map((q) => `
        <div class="q ${q.urgent ? "urgent" : ""}" data-qid="${esc(q.qid)}">
          <div><span class="key">${esc(q.key)}</span> ${esc(q.summary)}
            ${q.urgent ? '<span class="tag">urgent</span>' : ""}</div>
          <div class="opts">${esc(q.repo)} ${esc(q.ticket)}</div>
          <div class="answer">
            ${q.options.map((o) => `<button class="opt" data-opt="${esc(o)}">${esc(o)}</button>`).join("")}
            <input placeholder="answer ${esc(q.key)}…" value="${esc(answers[q.qid] || "")}">
            <button class="send">send</button>
          </div>
          <div class="said" data-said="${esc(q.qid)}">${esc(said[q.qid] || "")}</div>
        </div>`).join("")
      : '<div class="empty">Nothing waiting on you.</div>';
  }
  for (const [qid, msg] of Object.entries(said)) {
    const el = document.querySelector(`[data-said="${CSS.escape(qid)}"]`);
    if (el) { el.textContent = msg; el.className = "said" + (msg.startsWith("!") ? " bad" : ""); }
  }

  // Blocked first: those are the ones costing you time.
  const order = { blocked: 0, failed: 1, working: 2, stopped: 3, done: 4 };
  const workers = [...d.workers].sort((a, b) => (order[a.state] ?? 9) - (order[b.state] ?? 9));
  $("workers").innerHTML = workers.length
    ? `<div class="grid">${workers.map((w) => `
        <div class="panel card ${esc(w.state)}${selected === (w.id || w.name) ? " open" : ""}" data-id="${esc(w.id || w.name)}">
          <div class="top">
            <span class="dot"></span>
            <span class="name">${esc(w.name || w.id || "?")}</span>
            <span class="state">${esc(w.state)}${w.needs ? " · " + esc(w.needs) : ""}</span>
          </div>
          ${w.title ? `<div class="title">${esc(w.title)}</div>` : ""}
          <div class="meta">
            ${w.repo ? `<span>${esc(w.repo)}</span>` : ""}
            ${w.ticketStatus ? `<span>${esc(w.ticketStatus)}</span>` : ""}
            ${w.startedAt ? `<span>${ago(w.startedAt)}</span>` : ""}
            ${w.tokens ? `<span>${tokens(w.tokens)}</span>` : ""}
          </div>
          ${w.detail ? `<div class="detail">${esc(w.detail)}</div>` : ""}
        </div>`).join("")}</div>`
    : '<div class="panel empty">No workers running.</div>';

  $("tickets").innerHTML = d.tickets.length
    ? `<table>${d.tickets.map((t) => `
        <tr><td class="s">${esc(t.repo)}</td><td class="s">${esc(t.id)}</td>
            <td>${esc(t.title)}</td><td class="s">${esc(t.status)}</td></tr>`).join("")}</table>`
    : '<div class="empty">No tickets.</div>';
}

async function sendAnswer(row) {
  const qid = row.dataset.qid;
  const input = row.querySelector("input");
  const text = input.value.trim();
  if (!text) { input.focus(); return; }

  const buttons = row.querySelectorAll("button");
  buttons.forEach((b) => (b.disabled = true));
  said[qid] = "sending…";
  try {
    const r = await fetch("/api/answer", {
      method: "POST",
      headers: { "content-type": "application/json", "x-ambrosio": "1" },
      body: JSON.stringify({ qid, text }),
    });
    const d = await r.json();
    if (!r.ok || d.error) throw new Error(d.error || "failed");
    said[qid] = d.delivery === "resumed"
      ? `sent — ${d.ticket} picked it up`
      : `sent — ${d.ticket} is mid-turn, the next tick hands it over`;
    delete answers[qid];
    input.value = "";
    lastQSig = null;   // let the panel rebuild now that this one is answered
  } catch (e) {
    said[qid] = "! " + e.message;
  } finally {
    buttons.forEach((b) => (b.disabled = false));
    poll();
  }
}

$("questions").addEventListener("click", (e) => {
  const row = e.target.closest("[data-qid]");
  if (!row) return;
  if (e.target.classList.contains("opt")) {
    const input = row.querySelector("input");
    input.value = e.target.dataset.opt;
    answers[row.dataset.qid] = input.value;
    input.focus();
  } else if (e.target.classList.contains("send")) {
    sendAnswer(row);
  }
});

$("questions").addEventListener("input", (e) => {
  const row = e.target.closest("[data-qid]");
  if (row) answers[row.dataset.qid] = e.target.value;
});

$("questions").addEventListener("keydown", (e) => {
  const row = e.target.closest("[data-qid]");
  if (row && e.key === "Enter") { e.preventDefault(); sendAnswer(row); }
});

let selected = null;   // id of the worker whose drawer is showing

function evLabel(e) {
  if (e.kind === "tool_use") return e.tool || "tool";
  if (e.kind === "tool_result") return e.isError ? "error" : "result";
  return e.kind;
}

function clock(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  return isNaN(d) ? "" : d.toTimeString().slice(0, 8);
}

/** "12s", "4m", "1h20" — short enough for a gutter. */
function since(ms) {
  const sec = Math.max(0, Math.round(ms / 1000));
  if (sec < 60) return sec + "s";
  if (sec < 3600) return Math.floor(sec / 60) + "m";
  return Math.floor(sec / 3600) + "h" + String(Math.floor((sec % 3600) / 60)).padStart(2, "0");
}

function renderDetail(d) {
  $("d-name").textContent = d.worker.name || d.worker.id || "?";
  $("d-state").textContent = d.worker.state + (d.worker.needs ? " · " + d.worker.needs : "");
  $("drawer").querySelector(".head").className = "head " + d.worker.state;

  const t = d.ticket;
  const parts = [];

  if (t) {
    parts.push('<div class="sub">Ticket</div>');
    parts.push(`<div class="box"><b>${esc(t.id)}</b> ${esc(t.title)}<br>
      <span style="color:var(--dim)">${esc(t.repo)} · ${esc(t.status)}</span>
      ${t.acceptance ? `<br><br><span style="color:var(--dim)">Done when:</span> ${esc(t.acceptance)}` : ""}</div>`);
  }

  if (d.questions.length) {
    parts.push('<div class="sub">Parked for you</div>');
    parts.push(d.questions.map((q) =>
      `<div class="box"><b>${esc(q.key)}</b> ${esc(q.summary)}
        ${q.options.length ? `<br><span style="color:var(--dim)">${q.options.map(esc).join(" · ")}</span>` : ""}</div>`).join(""));
  }

  // How long each step took is the thing that shows a worker is stuck, so the
  // gap from the previous event is measured in order, before reversing.
  const events = d.transcript.map((e, i) => {
    const prev = d.transcript[i - 1];
    const gap = prev && prev.at && e.at ? new Date(e.at) - new Date(prev.at) : 0;
    return { ...e, gap };
  });
  const last = events.length ? events[events.length - 1].at : null;

  parts.push('<div class="sub">Activity' +
    (last ? ` <span class="since">— last step ${esc(since(Date.now() - new Date(last)))} ago</span>` : "") +
    "</div>");

  parts.push(events.length
    ? [...events].reverse().map((e) =>
        `<div class="ev ${esc(e.kind)}${e.isError ? " err" : ""}">
           <span class="ts">${esc(clock(e.at))}</span>
           <span class="k">${esc(evLabel(e))}${e.gap >= 5000 ? `<span class="gap">+${esc(since(e.gap))}</span>` : ""}</span>
           <span class="v">${esc(e.summary)}</span>
         </div>`).join("")
    : '<div class="empty">No transcript for this session yet.</div>');

  if (d.sessionId) {
    parts.push(`<div class="sub">Session</div><div class="box" style="color:var(--dim)">${esc(d.sessionId)}<br>${esc(d.worker.cwd)}</div>`);
  }

  $("d-body").innerHTML = parts.join("");
}

async function loadDetail() {
  if (!selected) return;
  try {
    const r = await fetch("/api/worker/" + encodeURIComponent(selected));
    if (!r.ok) throw new Error("worker is gone");
    renderDetail(await r.json());
  } catch (e) {
    $("d-body").innerHTML = `<div class="empty">Could not load: ${esc(e.message)}</div>`;
  }
}

function openWorker(id) {
  selected = id;
  $("drawer").hidden = false;
  $("d-body").innerHTML = '<div class="empty">Loading…</div>';
  loadDetail();
  poll();
}

function closeWorker() {
  selected = null;
  $("drawer").hidden = true;
  poll();
}

$("close").addEventListener("click", closeWorker);
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeWorker(); });
$("workers").addEventListener("click", (e) => {
  const card = e.target.closest(".card[data-id]");
  if (card) openWorker(card.dataset.id);
});


// --- Ambrosio ---------------------------------------------------------------
// A 24x24 butler who wanders the corner like a Tamagotchi and reacts to the
// fleet. Drawn a pixel at a time onto a 48x30 canvas, scaled up by CSS with
// nearest-neighbour, so it stays properly pixelated at any zoom.

const SPRITES = {
  stand: ["........................", "........oooooooo........", "......oohhhhhhhhoo......", ".....ohhhhhhhhhhhho.....", "....ohhhhhHHHHhhhhho....", ".....ohhsssssssshho.....", ".....ohsseesseessho.....", ".....ohssssssssssho.....", ".....osssmmmmmmssso.....", ".....ossssddddsssso.....", "......oddddddddddo......", ".......owwwwwwwwo.......", "....occcccwoowccccco....", "...occccccCwwCcccccco...", "...occcccccwwccccccco...", "...occcccccccccccccco...", "...occcccccccccccccco...", "....occcccccccccccco....", ".....occcc....cccco.....", ".....occcc....cccco.....", "....oooooo....oooooo....", "........................", "........................", "........................"],
  blink: ["........................", "........oooooooo........", "......oohhhhhhhhoo......", ".....ohhhhhhhhhhhho.....", "....ohhhhhHHHHhhhhho....", ".....ohhsssssssshho.....", ".....ohssddssddssho.....", ".....ohssssssssssho.....", ".....osssmmmmmmssso.....", ".....ossssddddsssso.....", "......oddddddddddo......", ".......owwwwwwwwo.......", "....occcccwoowccccco....", "...occccccCwwCcccccco...", "...occcccccwwccccccco...", "...occcccccccccccccco...", "...occcccccccccccccco...", "....occcccccccccccco....", ".....occcc....cccco.....", ".....occcc....cccco.....", "....oooooo....oooooo....", "........................", "........................", "........................"],
  walk: ["........................", "........oooooooo........", "......oohhhhhhhhoo......", ".....ohhhhhhhhhhhho.....", "....ohhhhhHHHHhhhhho....", ".....ohhsssssssshho.....", ".....ohsseesseessho.....", ".....ohssssssssssho.....", ".....osssmmmmmmssso.....", ".....ossssddddsssso.....", "......oddddddddddo......", ".......owwwwwwwwo.......", "....occcccwoowccccco....", "...occccccCwwCcccccco...", "...occcccccwwccccccco...", "...occcccccccccccccco...", "...occcccccccccccccco...", "....occcccccccccccco....", "....occcc......cccco....", ".....occcc....cccco.....", "...oooooo......oooooo...", "........................", "........................", "........................"],
  bow: ["........................", "........................", "........................", "........oooooooo........", "......oohhhhhhhhoo......", ".....ohhhhhhhhhhhho.....", "....ohhhhhHHHHhhhhho....", ".....ohhsssssssshho.....", ".....ohsseesseessho.....", ".....ohssssssssssho.....", ".....osssmmmmmmssso.....", ".....ossssddddsssso.....", "......oddddddddddo......", ".......owwwwwwwwo.......", "....occcccwoowccccco....", "...occccccCwwCcccccco...", "...occcccccwwccccccco...", "...occcccccccccccccco...", "...occcccccccccccccco...", "....occcccccccccccco....", ".....occcc....cccco.....", "........................", "........................", "........................"],
};
const TRAY = ["..gg.gg.gg..", "waaaaaaaaaaw", ".oAAAAAAAAo."];

const PALETTES = {
  light: { o: "#14100e", c: "#262422", C: "#3d3936", w: "#f4f1e8", s: "#f2caa2", d: "#c99a6e",
           h: "#e2ded6", H: "#a9a49a", e: "#241a14", m: "#a49d92",
           a: "#cfd6dc", A: "#8e979f", g: "#e2ad35" },
  // Lifted coat plus a grey rim, so he reads as a butler and not a floating head.
  dark:  { o: "#6d675e", c: "#33302d", C: "#4a4643", w: "#f4f1e8", s: "#f2caa2", d: "#c99a6e",
           h: "#e8e4dc", H: "#9d988e", e: "#1a1410", m: "#b3aca1",
           a: "#dbe1e6", A: "#7d858c", g: "#efbb45" },
};
let PAL = PALETTES.light;

function pickPalette() {
  const attr = document.documentElement.dataset.theme;
  const dark = attr === "dark" || (attr !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
  PAL = dark ? PALETTES.dark : PALETTES.light;
}
pickPalette();
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { pickPalette(); drawScene(); });

const pet = {
  x: 12, dir: 1, mood: "idle", pose: "stand",
  hold: 0,        // ticks left in the current pose
  blink: 0, t: 0, bounce: 0,
};

const cv = $("pet-canvas");
const cx = cv.getContext("2d");
cx.imageSmoothingEnabled = false;

function px(x, y, colour) {
  cx.fillStyle = colour;
  cx.fillRect(x, y, 1, 1);
}

function stamp(rows, ox, oy, flip) {
  const w = rows[0].length;
  rows.forEach((row, y) => {
    for (let x = 0; x < w; x++) {
      const ch = row[x];
      if (ch === ".") continue;
      const colour = PAL[ch];
      if (colour) px(ox + (flip ? w - 1 - x : x), oy + y, colour);
    }
  });
}

function drawScene() {
  cx.clearRect(0, 0, 48, 30);

  // a quiet dotted floor, so he is standing somewhere rather than nowhere
  for (let x = 1; x < 47; x += 3) px(x, 27, PAL.H);

  const bounce = pet.mood === "alarm" ? (pet.t % 4 < 2 ? -2 : 0)
               : pet.mood === "attention" ? (pet.t % 10 < 5 ? -1 : 0)
               : (pet.pose === "walk" && pet.t % 2 === 0) ? -1 : 0;
  const y = 3 + bounce;

  // contact shadow, tightened when he lifts off
  const shadow = bounce ? 8 : 10;
  for (let i = 0; i < shadow; i++) px(pet.x + 7 + i + (10 - shadow) / 2, 26, PAL.H);

  // he turns to face you the moment he needs something
  const facing = (pet.mood === "attention" || pet.mood === "alarm") ? false : pet.dir < 0;
  let pose = pet.pose;
  if (pet.blink > 0) pose = "blink";
  stamp(SPRITES[pose] || SPRITES.stand, pet.x, y, facing);

  // The tray rides at his waist while he works and lifts to chest height when
  // he is presenting something to you. A slow wobble keeps it alive.
  const wobble = pet.t % 8 < 4 ? 0 : 1;
  const trayY = y + ((pet.mood === "attention" || pet.mood === "alarm") ? 11 : 15) + wobble;
  stamp(TRAY, pet.x + 6, trayY, false);
}

const MOODS = {
  idle:      { text: "all quiet" },
  busy:      { text: "working" },
  attention: { text: "needs you" },
  alarm:     { text: "check the board" },
};

function setMood(d) {
  const failed = d.workers.filter((w) => w.state === "failed").length;
  const blocked = d.workers.filter((w) => w.state === "blocked").length;
  const working = d.workers.filter((w) => w.state === "working").length;

  let mood = "idle", text = MOODS.idle.text;
  if (failed || d.anomalies.length) {
    mood = "alarm";
    text = failed ? `${failed} worker${failed > 1 ? "s" : ""} failed` : "something is off";
  } else if (d.questions.length || blocked) {
    mood = "attention";
    const n = d.questions.length || blocked;
    text = `${n} waiting on you`;
  } else if (working) {
    mood = "busy";
    text = `${working} working`;
  }

  pet.mood = mood;
  const b = $("bubble");
  b.textContent = text;
  b.className = "show " + mood;
}

function tick() {
  pet.t++;
  if (pet.blink > 0) pet.blink--;
  else if (Math.random() < 0.03) pet.blink = 2;

  if (pet.mood === "attention" || pet.mood === "alarm") {
    pet.pose = "stand";          // he stops and faces you when he needs something
  } else if (pet.hold > 0) {
    pet.hold--;
  } else if (pet.pose === "walk") {
    pet.x += pet.dir;
    if (pet.x <= 1) { pet.x = 1; pet.dir = 1; }
    if (pet.x >= 23) { pet.x = 23; pet.dir = -1; }
    // busy means brisk; idle means he stops to look around
    if (pet.mood === "idle" && Math.random() < 0.06) { pet.pose = "stand"; pet.hold = 8 + (Math.random() * 16 | 0); }
  } else {
    if (Math.random() < (pet.mood === "busy" ? 0.6 : 0.15)) {
      pet.pose = "walk";
      if (Math.random() < 0.4) pet.dir *= -1;
    } else if (Math.random() < 0.05) {
      pet.pose = "bow"; pet.hold = 5;
    }
  }
  if (pet.pose === "bow" && pet.hold === 0) pet.pose = "stand";

  drawScene();
}

$("screen").addEventListener("click", () => {   // a butler bows when greeted
  pet.pose = "bow";
  pet.hold = 6;
  drawScene();
});

drawScene();
setInterval(tick, 130);   // 8fps, the way these things moved

async function poll() {
  try {
    const r = await fetch("/api/board");
    const d = await r.json();
    if (d.error) throw new Error(d.error);
    $("stale").innerHTML = d.version === UI_VERSION ? "" :
      '<div class="panel" id="stale-banner">This page is newer than the server it is talking to, ' +
      'so some of it will not work. Restart it: <b>bin/ambrosio ui</b></div>';
    render(d);
    setMood(d);
    $("live").className = "";
    $("live").textContent = "updated " + new Date().toLocaleTimeString();
    loadDetail();
  } catch (e) {
    // Say so loudly: a frozen board that looks calm is the failure mode to avoid.
    $("live").className = "stale";
    $("live").textContent = "stale — " + e.message;
  }
}

poll();
setInterval(poll, 3000);
</script>
</body>
</html>
