<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ambrosio — fleet</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f6f4; --panel: #fff; --line: #e2e2dd; --ink: #1a1a18; --dim: #6b6b64;
    --working: #1f7a4d; --blocked: #b3730a; --failed: #b02b2b; --idle: #8a8a82;
    --urgent-bg: #fdf0ec; --urgent-line: #e8bfae;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14140f; --panel: #1c1c18; --line: #2e2e28; --ink: #eceae2; --dim: #918f84;
      --working: #5fc38a; --blocked: #e0a83c; --failed: #e5706b; --idle: #6f6f66;
      --urgent-bg: #2b1c18; --urgent-line: #6b3a2c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--mono);
    padding: 20px; max-width: 1200px; margin-inline: auto;
  }
  header { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
  h1 { font-size: 18px; margin: 0; letter-spacing: .06em; text-transform: uppercase; }
  .stats { color: var(--dim); display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; }
  .stats b { color: var(--ink); font-weight: 600; }
  #ask-wrap { margin-left: auto; display: flex; gap: 6px; align-items: center; }
  #ask { font: inherit; font-size: 12px; padding: 5px 9px; width: 260px; max-width: 40vw;
         background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 4px; }
  #ask:focus { outline: none; border-color: var(--ink); }
  #answer { margin: 10px 0 0; padding: 12px 14px; white-space: pre-wrap; }
  #answer .who { display: block; font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
                 color: var(--dim); margin-bottom: 6px; }

  #menu {
    position: fixed; z-index: 30; min-width: 216px; padding: 4px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
    box-shadow: 0 6px 20px rgba(0,0,0,.18);
  }
  #menu[hidden] { display: none; }
  #menu .head { padding: 6px 10px 7px; font-size: 11px; letter-spacing: .07em; text-transform: uppercase;
                color: var(--dim); border-bottom: 1px solid var(--line); margin-bottom: 4px; }
  #menu button {
    display: block; width: 100%; text-align: left; font: inherit; font-size: 13px;
    padding: 7px 10px; border: 0; border-radius: 4px; background: none; color: var(--ink); cursor: pointer;
  }
  #menu button:hover { background: color-mix(in srgb, var(--ink) 8%, transparent); }
  #menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }
  #answer[hidden] { display: none; }
  #live { font-size: 12px; color: var(--dim); }
  #live.stale { color: var(--failed); }

  h2 { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim);
       margin: 22px 0 8px; font-weight: 600; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }

  .banner { border-color: var(--urgent-line); background: var(--urgent-bg); padding: 10px 12px; margin-bottom: 4px; }
  .banner div + div { margin-top: 4px; }

  .grid { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
  .card { padding: 10px 12px; }
  .card .top { display: flex; align-items: center; gap: 8px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--idle); }
  .working .dot { background: var(--working); animation: pulse 1.8s ease-in-out infinite; }
  .blocked .dot { background: var(--blocked); }
  .failed  .dot { background: var(--failed); }
  @keyframes pulse { 50% { opacity: .35; } }
  .name { font-weight: 600; }
  .state { margin-left: auto; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); }
  .blocked .state { color: var(--blocked); }
  .state .silent { color: var(--failed); }
  .failed  .state { color: var(--failed); }
  .stale   .state { color: var(--failed); }
  .folded { margin-top: 12px; }
  .folded summary { cursor: pointer; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); padding: 6px 0; }
  .folded .grid { margin-top: 8px; opacity: .7; }
  #stats .paused { color: var(--failed); font-weight: 700; letter-spacing: .08em; }
  #tabs { display: flex; gap: 2px; margin: 14px 0 12px; border-bottom: 1px solid var(--line); }
  #tabs button { font: inherit; font-size: 11px; text-transform: uppercase; letter-spacing: .1em; padding: 8px 14px; background: none; border: none; border-bottom: 2px solid transparent; color: var(--dim); cursor: pointer; margin-bottom: -1px; }
  #tabs button.on { color: var(--ink); border-bottom-color: var(--ink); }
  #tabs .badge { display: inline-block; margin-left: 6px; min-width: 14px; padding: 0 4px; border-radius: 8px; background: var(--ink); color: var(--panel); font-size: 10px; text-align: center; }
  #dialog { margin-top: 4px; }
  .q .land { font-size: 12px; margin: 4px 0 2px; }
  .q .ttl { cursor: pointer; }
  .q .ttl:hover .more { color: var(--ink); }
  .q .more { font-size: 11px; color: var(--dim); margin-left: 6px; }
  #drawer .head.ticket { border-color: var(--ink); }
  #drawer .pre { white-space: pre-wrap; }
  #drawer .small { font-size: 11px; color: var(--dim); max-height: 260px; overflow: auto; }
  #drawer .crit { margin: 0; padding-left: 18px; }
  #drawer .crit li { margin: 2px 0; }
  #drawer .land.ok { color: var(--ok, #2a7); }
  #drawer .land.no { color: var(--failed); }
  #d-ask { width: 100%; font: inherit; font-size: 12px; padding: 5px 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
  .q .land.ok { color: var(--ok, #2a7); }
  .q .land.no { color: var(--failed); }
  .q .land a { color: inherit; }
  #standing .inst { display: flex; gap: 10px; align-items: baseline; padding: 4px 0; }
  #standing .inst .when { color: var(--dim); font-size: 11px; }
  #standing .inst button { margin-left: auto; font: inherit; font-size: 11px; background: none; border: 1px solid var(--line); color: var(--dim); cursor: pointer; padding: 2px 8px; }
  #thread .msg { padding: 6px 0; border-bottom: 1px solid var(--line); }
  #thread .msg:last-child { border-bottom: none; }
  #thread .who { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); margin-right: 8px; }
  #thread .tag { font-size: 11px; color: var(--dim); margin-left: 8px; }
  #thread .tag.bad { color: var(--failed); }
  #thread .text { white-space: pre-wrap; }
  #say-wrap { display: flex; gap: 8px; margin-top: 8px; align-items: flex-start; }
  #say { flex: 1; font: inherit; font-size: 12px; padding: 6px 9px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); resize: vertical; }
  #say:focus { outline: none; border-color: var(--ink); }
  #say-send { font: inherit; font-size: 12px; padding: 6px 12px; border: 1px solid var(--ink); background: var(--ink); color: var(--panel); cursor: pointer; }
  #say-send:disabled { opacity: .5; cursor: default; }
  .title { margin-top: 3px; }
  .meta { margin-top: 6px; font-size: 12px; color: var(--dim); display: flex; gap: 12px; flex-wrap: wrap; }
  .detail { margin-top: 6px; font-size: 12px; color: var(--dim); border-left: 2px solid var(--line); padding-left: 8px; }
  .stage { image-rendering: pixelated; width: 300px; max-width: 100%; height: 68px; display: block; margin: 8px 0 0 -6px; }
  .stagenow { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); margin-top: -4px; }
  .stagenow b { color: var(--ink); font-weight: 600; }
  .stagenow.parked b { color: var(--blocked); }

  .q { padding: 10px 12px; border-bottom: 1px solid var(--line); }
  .q:last-child { border-bottom: 0; }
  .q.urgent { background: var(--urgent-bg); }
  .key { font-weight: 700; }
  .opts { margin-top: 4px; font-size: 12px; color: var(--dim); }
  .tag { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--failed); margin-left: 6px; }

  .answer { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .answer input {
    flex: 1 1 220px; min-width: 0; font: inherit; font-size: 12px; padding: 5px 8px;
    background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 4px;
  }
  .answer input:focus { outline: none; border-color: var(--ink); }
  .answer button {
    font: inherit; font-size: 12px; padding: 5px 11px; cursor: pointer; border-radius: 4px;
    border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  }
  .answer button:hover { border-color: var(--ink); }
  .answer button.send { border-color: var(--working); color: var(--working); font-weight: 600; }
  .answer button:disabled { opacity: .5; cursor: default; }
  .said { margin-top: 6px; font-size: 12px; color: var(--working); }
  .said.bad { color: var(--failed); }

  #stale-banner { border-color: var(--failed); background: var(--urgent-bg); padding: 10px 12px;
                  margin-bottom: 10px; color: var(--failed); }


  /* --- Ambrosio, the butler in the corner ------------------------------- */
  #pet {
    position: fixed; right: 18px; bottom: 18px; z-index: 20;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    user-select: none;
  }
  #bubble {
    font-size: 10px; letter-spacing: .08em; text-transform: uppercase;
    background: var(--panel); border: 1px solid var(--line); color: var(--dim);
    padding: 4px 8px; border-radius: 3px; white-space: nowrap;
    position: relative; opacity: 0; transition: opacity .25s ease;
  }
  #bubble.show { opacity: 1; }
  #bubble::after {                      /* little pixel tail */
    content: ""; position: absolute; left: 50%; margin-left: -3px; bottom: -4px;
    width: 6px; height: 3px; background: var(--panel);
    border-right: 1px solid var(--line); border-bottom: 1px solid var(--line);
  }
  #bubble.attention { color: var(--blocked); border-color: var(--blocked); }
  #bubble.alarm { color: var(--failed); border-color: var(--failed); }

  #screen {
    background: linear-gradient(180deg, var(--panel), var(--bg));
    border: 1px solid var(--line); border-radius: 7px; padding: 5px;
    box-shadow: 0 4px 14px rgba(0,0,0,.14), inset 0 1px 0 rgba(255,255,255,.25);
    cursor: pointer; line-height: 0;
  }
  #screen:hover { border-color: var(--dim); }
  #pet canvas {
    image-rendering: pixelated; image-rendering: crisp-edges;
    width: 192px; height: 120px; display: block; border-radius: 3px;
  }
  @media (max-width: 700px) { #pet { display: none; } }

  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  td { padding: 5px 12px; border-bottom: 1px solid var(--line); }
  tr:last-child td { border-bottom: 0; }
  td.s { color: var(--dim); width: 1%; white-space: nowrap; }
  .empty { padding: 12px; color: var(--dim); font-size: 12px; }

  .card { cursor: pointer; }
  .card:hover { border-color: var(--dim); }
  .card.open { border-color: var(--ink); }

  #drawer[hidden] { display: none; }
  #drawer {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(620px, 100vw);
    background: var(--panel); border-left: 1px solid var(--line);
    display: flex; flex-direction: column; box-shadow: -8px 0 24px rgba(0,0,0,.16); z-index: 10;
  }
  #drawer .head { padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
  #drawer .head .name { font-size: 15px; }
  #drawer .body { overflow-y: auto; padding: 12px 16px 24px; }
  #close { margin-left: auto; background: none; border: 1px solid var(--line); color: var(--ink);
           border-radius: 4px; cursor: pointer; font: inherit; font-size: 12px; padding: 3px 9px; }
  #close:hover { border-color: var(--ink); }
  .sub { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim);
         margin: 16px 0 6px; font-weight: 600; }
  .sub:first-child { margin-top: 0; }
  .box { border: 1px solid var(--line); border-radius: 5px; padding: 9px 11px; font-size: 12px; }
  .box + .box { margin-top: 6px; }

  .ev { display: flex; gap: 8px; padding: 5px 0; border-bottom: 1px solid var(--line); font-size: 12px; }
  .ev:last-child { border-bottom: 0; }
  .ev .ts { flex: none; width: 58px; color: var(--dim); font-size: 11px; padding-top: 1px;
            font-variant-numeric: tabular-nums; }
  .ev .k { flex: none; width: 66px; color: var(--dim); font-size: 11px; text-transform: uppercase;
           letter-spacing: .06em; padding-top: 1px; }
  .gap { color: var(--blocked); font-size: 10px; margin-left: 6px; }
  .since { text-transform: none; letter-spacing: 0; font-weight: 400; }
  .ev .v { white-space: pre-wrap; word-break: break-word; min-width: 0; }
  .ev.tool_use .v { color: var(--ink); }
  .ev.tool_use .k { color: var(--working); }
  .ev.tool_result .v { color: var(--dim); }
  .ev.err .k, .ev.err .v { color: var(--failed); }
  .ev.thinking .v { color: var(--dim); font-style: italic; }
</style>
</head>
<body>
<header>
  <h1>Ambrosio</h1>
  <div class="stats" id="stats"></div>
  <div id="ask-wrap">
    <input id="ask" placeholder="ask Ambrosio about the work…">
    <div id="live">connecting…</div>
  </div>
</header>

<div class="panel" id="answer" hidden></div>



<div id="menu" hidden></div>

<nav id="tabs">
  <button data-tab="board" class="on">Board</button>
  <button data-tab="dialog">Dialog<span id="tab-standing" class="badge" hidden></span></button>
</nav>

<section id="board" class="tab">
<div id="stale"></div>
<div id="anomalies"></div>

<h2>Needs you</h2>
<div class="panel" id="questions"></div>

<h2>Workers</h2>
<div id="workers"></div>

<div id="pet" title="Ambrosio">
  <div id="bubble"></div>
  <div id="screen"><canvas id="pet-canvas" width="48" height="30"></canvas></div>
</div>

<aside id="drawer" hidden>
  <div class="head">
    <span class="dot"></span>
    <span class="name" id="d-name"></span>
    <span class="state" id="d-state"></span>
    <button id="close">close</button>
  </div>
  <div class="body" id="d-body"></div>
</aside>

<h2>Tickets</h2>
<div class="panel" id="tickets"></div>
</section>

<section id="dialog" class="tab" hidden>
  <div class="label">STANDING</div>
  <div id="standing" class="panel"></div>
  <div class="label">DIALOG</div>
  <div id="thread" class="panel"></div>
  <div id="say-wrap">
    <textarea id="say" rows="2" placeholder="Tell Ambrosio: an instruction that stands until you retire it, a question, or anything from the Messages grammar (pause, resume, A1 accept, gmc-xyz defer, @gmc-xyz …)"></textarea>
    <button id="say-send">send</button>
  </div>
</section>

<script src="/butler.js"></script>
<script>
const UI_VERSION = "12";       // must match UI_VERSION in src/ui.ts
const answers = {};            // qid -> draft text, kept across re-renders
const said = {};               // qid -> what happened when we sent it
let lastQSig = null;           // questions panel is only rebuilt when it changes

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function ago(ms) {
  if (!ms) return "";
  const s = Math.max(0, Math.floor((Date.now() - ms) / 1000));
  if (s < 60) return s + "s";
  if (s < 3600) return Math.floor(s / 60) + "m";
  return Math.floor(s / 3600) + "h" + String(Math.floor((s % 3600) / 60)).padStart(2, "0");
}

function tokens(n) {
  if (!n) return "";
  return n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : Math.round(n / 1000) + "k";
}

const TAGS = { action: (ok) => ok ? "did" : "could not", question: () => "answered", instruction: () => "standing", note: () => "" };

function renderDialog(d) {
  const inst = d.instructions || [];
  $("tab-standing").textContent = String(inst.length);
  $("tab-standing").hidden = inst.length === 0;
  $("standing").innerHTML = inst.length
    ? inst.map((i) => `<div class="inst"><span class="text">${esc(i.text)}</span><span class="when">${esc(ago(i.at))}</span><button data-retire="${esc(i.id)}">retire</button></div>`).join("")
    : '<div class="empty">Nothing standing. Anything you say below that is not a question or a command stands until you retire it.</div>';
  const thread = d.dialog || [];
  $("thread").innerHTML = thread.length
    ? thread.map((e) => {
        const tag = e.from === "ambrosio" ? (TAGS[e.kind] || TAGS.note)(e.ok !== false) : "";
        return `<div class="msg ${esc(e.from)}"><span class="who">${e.from === "jaime" ? "you" : "ambrosio"}</span>${
          tag ? `<span class="tag${e.ok === false ? " bad" : ""}">${esc(tag)}</span>` : ""
        }<div class="text">${esc(e.text)}</div></div>`;
      }).join("")
    : '<div class="empty">Tell Ambrosio something. It talks back here, and what you tell it binds.</div>';
}

async function sayToAmbrosio(text) {
  text = (text || "").trim();
  if (!text) return;
  $("say").disabled = true; $("say-send").disabled = true;
  try {
    const r = await fetch("/api/dialog", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ text }) });
    const d = await r.json();
    if (d.error) throw new Error(d.error);
    $("say").value = "";
    renderDialog(d);
  } catch (err) {
    $("thread").innerHTML += `<div class="msg ambrosio"><span class="who">ambrosio</span><span class="tag bad">could not</span><div class="text">${esc(err.message)}</div></div>`;
  } finally {
    $("say").disabled = false; $("say-send").disabled = false;
  }
}

async function retireInstruction(id) {
  const r = await fetch("/api/dialog/retire", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ id }) });
  const d = await r.json();
  renderDialog({ instructions: d.instructions, dialog: last.dialog });
}

function render(d) {
  last = d;
  renderDialog(d);
  $("stats").innerHTML =
    (d.paused ? `<span class="paused">PAUSED</span>` : "") +
    `<span>wip <b>${d.wip.used}/${d.wip.limit}</b></span>` +
    `<span>workers <b>${d.workers.filter((w) => !["stopped", "done"].includes(w.state)).length}</b></span>` +
    `<span>parked <b>${d.workers.filter((w) => ["stopped", "done"].includes(w.state)).length}</b></span>` +
    `<span>needs you <b>${d.questions.length + d.plans.length + d.accept.length}</b></span>` +
    (d.tokensToday ? `<span>today <b>${tokens(d.tokensToday)}</b></span>` : "");

  $("anomalies").innerHTML = d.anomalies.length
    ? `<div class="panel banner">${d.anomalies.map((a) => `<div>! ${esc(a)}</div>`).join("")}</div>`
    : "";

  const qSig = JSON.stringify([
    d.questions.map((q) => [q.qid, q.summary, q.urgent, q.options]),
    d.plans.map((x) => [x.key, x.id]),
    d.accept.map((x) => [x.key, x.id]),
  ]);
  if (qSig !== lastQSig) {
    lastQSig = qSig;
    // Everything that waits on Jaime, not just parked questions.
    const waiting = d.questions.length + d.plans.length + d.accept.length;
    $("questions").innerHTML = waiting
    ? d.questions.map((q) => `
        <div class="q ${q.urgent ? "urgent" : ""}" data-qid="${esc(q.qid)}">
          <div><span class="key">${esc(q.key)}</span> ${esc(q.summary)}
            ${q.urgent ? '<span class="tag">urgent</span>' : ""}</div>
          <div class="opts">${esc(q.repo)} ${esc(q.ticket)}</div>
          <div class="answer">
            ${q.options.map((o) => `<button class="opt" data-opt="${esc(o)}">${esc(o)}</button>`).join("")}
            <input placeholder="answer ${esc(q.key)}…" value="${esc(answers[q.qid] || "")}">
            <button class="send">send</button>
          </div>
          <div class="said" data-said="${esc(q.qid)}">${esc(said[q.qid] || "")}</div>
        </div>`)
      .concat(d.plans.map((x) => `
        <div class="q" data-decide="plan" data-ticket="${esc(x.id)}" data-repo="${esc(x.repo)}">
          <div><span class="key">${esc(x.key)}</span> ${esc(x.title)}</div>
          <div class="opts">${esc(x.repo)} ${esc(x.id)} — plan waiting for review</div>
          <div class="answer">
            <button class="go" data-kind="plan_ok">approve</button>
            <input placeholder="or say what to change…">
            <button class="go send" data-kind="plan_change">send back</button>
          </div>
          <div class="said" data-said="${esc(x.id)}">${esc(said[x.id] || "")}</div>
        </div>`))
      .concat(d.accept.map((x) => `
        <div class="q" data-decide="accept" data-ticket="${esc(x.id)}" data-repo="${esc(x.repo)}"${x.landable && !x.landable.ok ? ' data-forced="1"' : ""}>
          <div class="ttl" data-open="${esc(x.id)}" data-repo="${esc(x.repo)}" title="open the details"><span class="key">${esc(x.key)}</span> ${esc(x.title)} <span class="more">details ›</span></div>
          <div class="opts">${esc(x.repo)} ${esc(x.id)} — finished, waiting for you to accept</div>
          ${x.landable ? `<div class="land ${x.landable.ok ? "ok" : "no"}">${
            x.landable.pr ? `<a href="${esc(x.landable.pr.url)}" target="_blank">PR #${esc(String(x.landable.pr.number))}</a> · ` : ""
          }${x.landable.ok ? "landable" : "not landable: " + esc(x.landable.reasons.join("; "))}</div>` : ""}
          <div class="answer">
            <button class="go send" data-kind="accept">${x.landable && !x.landable.ok ? "accept anyway" : "accept"}</button>
            <input placeholder="or say what is wrong…">
            <button class="go" data-kind="reject">reject</button>
          </div>
          <div class="said" data-said="${esc(x.id)}">${esc(said[x.id] || "")}</div>
        </div>`))
      .join("")
      : '<div class="empty">Nothing waiting on you.</div>';
  }
  for (const [qid, msg] of Object.entries(said)) {
    const el = document.querySelector(`[data-said="${CSS.escape(qid)}"]`);
    if (el) { el.textContent = msg; el.className = "said" + (msg.startsWith("!") ? " bad" : ""); }
  }

  // Blocked first: those are the ones costing you time. Parked and finished
  // sessions fold away below — the view is for what is happening, and a
  // morning that opens on nine cards, seven of them dead, is a morning wasted.
  const order = { blocked: 0, failed: 1, stale: 2, working: 3, stopped: 4, done: 5 };
  const sorted = [...d.workers].sort((a, b) => (order[a.state] ?? 9) - (order[b.state] ?? 9));
  const isLive = (w) => !["stopped", "done"].includes(w.state);
  const live = sorted.filter(isLive);
  const folded = sorted.filter((w) => !isLive(w));
  const card = (w) => `
        <div class="panel card ${esc(w.state)}${selected === (w.id || w.name) ? " open" : ""}" data-id="${esc(w.id || w.name)}">
          <div class="top">
            <span class="dot"></span>
            <span class="name">${esc(w.name || w.id || "?")}</span>
            <span class="state">${esc(w.state)}${w.needs ? " · " + esc(w.needs) : ""}${
              w.silentFor !== null && w.silentFor >= 45 ? `<span class="silent"> · silent ${esc(ago(Date.now() - w.silentFor * 60000))}</span>` : ""
            }</span>
          </div>
          ${w.title ? `<div class="title">${esc(w.title)}</div>` : ""}
          <div class="meta">
            ${w.repo ? `<span>${esc(w.repo)}</span>` : ""}
            ${w.ticketStatus ? `<span>${esc(w.ticketStatus)}</span>` : ""}
            ${w.startedAt ? `<span>${ago(w.startedAt)}</span>` : ""}
            ${w.tokens ? `<span>${tokens(w.tokens)}</span>` : ""}
          </div>
          ${w.detail ? `<div class="detail">${esc(w.detail)}</div>` : ""}
          ${w.ticketStatus ? `<canvas class="stage" width="150" height="34" data-status="${esc(w.ticketStatus)}"></canvas>
          <div class="stagenow ${stageOf(w.ticketStatus).parked ? "parked" : ""}">${stageCaption(w.ticketStatus)}</div>` : ""}
        </div>`;
  $("workers").innerHTML =
    (live.length ? `<div class="grid">${live.map(card).join("")}</div>` : '<div class="panel empty">No workers running.</div>') +
    (folded.length ? `<details class="folded"><summary>${folded.length} parked or finished</summary><div class="grid">${folded.map(card).join("")}</div></details>` : "");

  // Each worker shows where its ticket stands, with the butler on the track.
  for (const c of document.querySelectorAll("canvas.stage")) drawStageTrack(c, c.dataset.status);

  $("tickets").innerHTML = d.tickets.length
    ? `<table>${d.tickets.map((t) => `
        <tr><td class="s">${esc(t.repo)}</td><td class="s">${esc(t.id)}</td>
            <td>${esc(t.title)}</td><td class="s">${esc(t.status)}</td></tr>`).join("")}</table>`
    : '<div class="empty">No tickets.</div>';
}

async function sendAnswer(row) {
  const qid = row.dataset.qid;
  const input = row.querySelector("input");
  const text = input.value.trim();
  if (!text) { input.focus(); return; }

  const buttons = row.querySelectorAll("button");
  buttons.forEach((b) => (b.disabled = true));
  said[qid] = "sending…";
  try {
    const r = await fetch("/api/answer", {
      method: "POST",
      headers: { "content-type": "application/json", "x-ambrosio": "1" },
      body: JSON.stringify({ qid, text }),
    });
    const d = await r.json();
    if (!r.ok || d.error) throw new Error(d.error || "failed");
    said[qid] = d.delivery === "resumed"
      ? `sent — ${d.ticket} picked it up`
      : `sent — ${d.ticket} is mid-turn, the next tick hands it over`;
    delete answers[qid];
    input.value = "";
    lastQSig = null;   // let the panel rebuild now that this one is answered
  } catch (e) {
    said[qid] = "! " + e.message;
  } finally {
    buttons.forEach((b) => (b.disabled = false));
    poll();
  }
}

async function sendDecision(row, kind) {
  const input = row.querySelector("input");
  const note = input.value.trim();
  const id = row.dataset.ticket;
  // Accepting over known defects is deliberate: the first click is refused and
  // names them, the second one goes through.
  const force = kind === "accept" && row.dataset.forced === "1";

  const buttons = row.querySelectorAll("button");
  buttons.forEach((b) => (b.disabled = true));
  said[id] = "sending…";
  try {
    const r = await fetch("/api/decide", {
      method: "POST",
      headers: { "content-type": "application/json", "x-ambrosio": "1" },
      body: JSON.stringify({ kind, ticket: id, repo: row.dataset.repo, note, force }),
    });
    const res = await r.json();
    if (!r.ok || res.error) throw new Error(res.error || "failed");
    said[id] = res.outcome === "closed" ? `accepted — ${id} closed`
             : res.outcome === "escalated" ? `bounced ${res.iteration - 1} times — ${id} is now waiting for you to rewrite it, not for another round`
             : res.outcome === "resumed" ? `sent — ${id} picked it up${res.iteration ? ` (round ${res.iteration})` : ""}`
             : res.outcome === "deferred" ? `sent — ${id} is mid-turn; it will get this as soon as it parks`
             : `sent — ${id} has no live worker, so it needs dispatching again`;
    input.value = "";
    lastQSig = null;
  } catch (e) {
    said[id] = "! " + e.message;
    if (kind === "accept" && /still open|not landable/.test(e.message)) {
      row.dataset.forced = "1";
      const btn = row.querySelector('button[data-kind="accept"]');
      if (btn) btn.textContent = "accept anyway";
    }
  } finally {
    buttons.forEach((b) => (b.disabled = false));
    if (!said[id]?.startsWith("!")) poll();
  }
}

$("questions").addEventListener("click", (e) => {
  const open = e.target.closest("[data-open]");
  if (open) { openTicket(open.dataset.repo, open.dataset.open); return; }
  const dec = e.target.closest("[data-decide]");
  if (dec && e.target.classList.contains("go")) { sendDecision(dec, e.target.dataset.kind); return; }
  const row = e.target.closest("[data-qid]");
  if (!row) return;
  if (e.target.classList.contains("opt")) {
    const input = row.querySelector("input");
    input.value = e.target.dataset.opt;
    answers[row.dataset.qid] = input.value;
    input.focus();
  } else if (e.target.classList.contains("send")) {
    sendAnswer(row);
  }
});

$("questions").addEventListener("input", (e) => {
  const row = e.target.closest("[data-qid]");
  if (row) answers[row.dataset.qid] = e.target.value;
});

$("questions").addEventListener("keydown", (e) => {
  const row = e.target.closest("[data-qid]");
  if (row && e.key === "Enter") { e.preventDefault(); sendAnswer(row); }
});

let selected = null;   // id of the worker whose drawer is showing
let selectedTicket = null;   // {repo, id} when the drawer shows a ticket instead

/** "BUILD — step 3 of 6", or what it is waiting for. */
function stageCaption(status) {
  const { index, parked } = stageOf(status);
  if (parked) return "<b>parked</b> — waiting on you";
  const label = STAGE_LABELS[STAGES[index]] ?? status;
  return `<b>${esc(label)}</b> — step ${index + 1} of ${STAGES.length}`;
}

function evLabel(e) {
  if (e.kind === "tool_use") return e.tool || "tool";
  if (e.kind === "tool_result") return e.isError ? "error" : "result";
  return e.kind;
}

function clock(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  return isNaN(d) ? "" : d.toTimeString().slice(0, 8);
}

/** "12s", "4m", "1h20" — short enough for a gutter. */
function since(ms) {
  const sec = Math.max(0, Math.round(ms / 1000));
  if (sec < 60) return sec + "s";
  if (sec < 3600) return Math.floor(sec / 60) + "m";
  return Math.floor(sec / 3600) + "h" + String(Math.floor((sec % 3600) / 60)).padStart(2, "0");
}

function renderDetail(d) {
  $("d-name").textContent = d.worker.name || d.worker.id || "?";
  $("d-state").textContent = d.worker.state + (d.worker.needs ? " · " + d.worker.needs : "");
  $("drawer").querySelector(".head").className = "head " + d.worker.state;

  const t = d.ticket;
  const parts = [];

  if (t) {
    parts.push('<div class="sub">Ticket</div>');
    parts.push(`<div class="box"><b>${esc(t.id)}</b> ${esc(t.title)}<br>
      <span style="color:var(--dim)">${esc(t.repo)} · ${esc(t.status)}</span>
      ${t.acceptance ? `<br><br><span style="color:var(--dim)">Done when:</span> ${esc(t.acceptance)}` : ""}</div>`);
  }

  if (d.questions.length) {
    parts.push('<div class="sub">Parked for you</div>');
    parts.push(d.questions.map((q) =>
      `<div class="box"><b>${esc(q.key)}</b> ${esc(q.summary)}
        ${q.options.length ? `<br><span style="color:var(--dim)">${q.options.map(esc).join(" · ")}</span>` : ""}</div>`).join(""));
  }

  // How long each step took is the thing that shows a worker is stuck, so the
  // gap from the previous event is measured in order, before reversing.
  const events = d.transcript.map((e, i) => {
    const prev = d.transcript[i - 1];
    const gap = prev && prev.at && e.at ? new Date(e.at) - new Date(prev.at) : 0;
    return { ...e, gap };
  });
  const last = events.length ? events[events.length - 1].at : null;

  parts.push('<div class="sub">Activity' +
    (last ? ` <span class="since">— last step ${esc(since(Date.now() - new Date(last)))} ago</span>` : "") +
    "</div>");

  parts.push(events.length
    ? [...events].reverse().map((e) =>
        `<div class="ev ${esc(e.kind)}${e.isError ? " err" : ""}">
           <span class="ts">${esc(clock(e.at))}</span>
           <span class="k">${esc(evLabel(e))}${e.gap >= 5000 ? `<span class="gap">+${esc(since(e.gap))}</span>` : ""}</span>
           <span class="v">${esc(e.summary)}</span>
         </div>`).join("")
    : '<div class="empty">No transcript for this session yet.</div>');

  if (d.sessionId) {
    parts.push(`<div class="sub">Session</div><div class="box" style="color:var(--dim)">${esc(d.sessionId)}<br>${esc(d.worker.cwd)}</div>`);
  }

  $("d-body").innerHTML = parts.join("");
}

function renderTicket(d) {
  const t = d.ticket;
  $("d-name").textContent = t.id;
  $("d-state").textContent = t.status + " · P" + t.priority;
  const head = $("drawer").querySelector(".head");
  if (head) head.className = "head ticket";
  const parts = [];
  parts.push(`<div class="box"><b>${esc(t.title)}</b><br><span style="color:var(--dim)">${esc(t.repo)}${d.externalRef ? ` · <a href="${esc(d.externalRef)}" target="_blank">${esc(d.externalRef.replace(/^https?:\/\//, ""))}</a>` : ""}</span></div>`);
  if (d.landable) {
    parts.push('<div class="sub">Can it land?</div>');
    parts.push(`<div class="box land ${d.landable.ok ? "ok" : "no"}">${d.landable.pr ? `<a href="${esc(d.landable.pr.url)}" target="_blank">PR #${esc(String(d.landable.pr.number))}</a> · ` : ""}${d.landable.ok ? "yes — landable" : "not yet: " + esc(d.landable.reasons.join("; "))}</div>`);
  }
  if (t.description) { parts.push('<div class="sub">What was asked</div>'); parts.push(`<div class="box pre">${esc(t.description)}</div>`); }
  if (t.acceptance.length) {
    parts.push('<div class="sub">Done when</div>');
    parts.push(`<div class="box"><ol class="crit">${t.acceptance.map((a) => `<li>${esc(a)}</li>`).join("")}</ol></div>`);
  }
  if (d.handover) { parts.push('<div class="sub">What the worker said at hand-over</div>'); parts.push(`<div class="box pre">${esc(d.handover)}</div>`); }
  if (d.defects.length) {
    parts.push('<div class="sub">Filed on the way</div>');
    parts.push(`<div class="box">${d.defects.map((x) => `<div><b>${esc(x.id)}</b> ${esc(x.title)} <span style="color:var(--dim)">· ${esc(x.status)}</span></div>`).join("")}</div>`);
  }
  if (d.timeline && d.timeline.length) {
    parts.push(`<div class="sub">Timeline${d.iteration ? ` <span class="since">— round ${esc(String(d.iteration))} of rework</span>` : ""}</div>`);
    parts.push(`<div class="box">${d.timeline.map((e) => {
      const what = e.kind === "status" ? `${esc(e.from || "")} → ${esc(e.status || "")}`
        : e.kind === "rejected" ? `rejected, round ${esc(String(e.iteration || ""))}: ${esc(e.note || "")}`
        : e.kind === "plan_change" ? `plan sent back, round ${esc(String(e.iteration || ""))}: ${esc(e.note || "")}`
        : `${esc(e.kind.replace(/_/g, " "))}${e.note ? ": " + esc(e.note) : ""}`;
      return `<div class="ev"><span class="ts">${esc(clock(e.at))}</span> <span class="k">${esc(e.by || "")}</span> <span class="v">${what}</span></div>`;
    }).join("")}</div>`);
  }
  if (d.evidence) { parts.push('<div class="sub">Evidence (tail)</div>'); parts.push(`<div class="box pre small">${esc(d.evidence)}</div>`); }
  if (d.plan) { parts.push('<div class="sub">Plan (tail)</div>'); parts.push(`<div class="box pre small">${esc(d.plan)}</div>`); }
  parts.push(`<div class="sub">Ask Ambrosio about this</div><div class="box"><input id="d-ask" placeholder="why is it not landable? what did the reviewer say?"><div id="d-answer" class="pre"></div></div>`);
  $("d-body").innerHTML = parts.join("");
  const ask = document.getElementById("d-ask");
  if (ask) ask.addEventListener("keydown", async (e) => {
    if (e.key !== "Enter" || !ask.value.trim()) return;
    const out = document.getElementById("d-answer");
    out.textContent = "…";
    try {
      const r = await fetch("/api/ask", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ question: ask.value.trim(), ticket: t.id }) });
      out.textContent = (await r.json()).answer;
    } catch (err) { out.textContent = "Could not ask: " + err.message; }
  });
}

async function openTicket(repo, id) {
  selected = null;
  selectedTicket = { repo, id };
  $("drawer").hidden = false;
  $("d-body").innerHTML = '<div class="empty">Loading…</div>';
  try {
    const r = await fetch("/api/ticket/" + encodeURIComponent(repo) + "/" + encodeURIComponent(id));
    const d = await r.json();
    if (d.error) throw new Error(d.error);
    renderTicket(d);
  } catch (e) {
    $("d-body").innerHTML = `<div class="empty">Could not load: ${esc(e.message)}</div>`;
  }
}

async function loadDetail() {
  if (!selected) return;
  try {
    const r = await fetch("/api/worker/" + encodeURIComponent(selected));
    if (!r.ok) throw new Error("worker is gone");
    renderDetail(await r.json());
  } catch (e) {
    $("d-body").innerHTML = `<div class="empty">Could not load: ${esc(e.message)}</div>`;
  }
}

function openWorker(id) {
  selectedTicket = null;
  selected = id;
  $("drawer").hidden = false;
  $("d-body").innerHTML = '<div class="empty">Loading…</div>';
  loadDetail();
  poll();
}

function closeWorker() {
  selected = null;
  selectedTicket = null;
  $("drawer").hidden = true;
  poll();
}

$("close").addEventListener("click", closeWorker);
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeWorker(); });
$("workers").addEventListener("click", (e) => {
  const card = e.target.closest(".card[data-id]");
  if (card) openWorker(card.dataset.id);
});


const butler = createButler($("pet-canvas"), {
  screen: $("screen"),
  onMood: (mood, text) => { const b = $("bubble"); b.textContent = text; b.className = "show " + mood; },
});


// Asking is a question, never a command: it reads the board and answers.
async function askAbout(question, ticket) {
  if (!question?.trim()) return;
  const box = $("answer");
  box.hidden = false;
  box.innerHTML = `<span class="who">${esc(ticket ? `about ${ticket}` : "about the fleet")} — ${esc(question)}</span>Ambrosio is looking…`;
  $("ask").disabled = true;
  try {
    const r = await fetch("/api/ask", {
      method: "POST",
      headers: { "content-type": "application/json", "x-ambrosio": "1" },
      body: JSON.stringify({ question, ticket: ticket || undefined }),
    });
    const d = await r.json();
    box.innerHTML = `<span class="who">${esc(ticket ? `about ${ticket}` : "about the fleet")} — ${esc(question)}</span>` + esc(d.answer || "(no answer)");
    if (d.ok) $("ask").value = "";
  } catch (err) {
    box.innerHTML = `<span class="who">${esc(question)}</span>Could not ask: ${esc(err.message)}`;
  } finally {
    $("ask").disabled = false;
  }
}

let last = { dialog: [], instructions: [] };

// Two tabs: the board is what is happening; the dialog is Jaime and Ambrosio
// talking. Which one he left open is remembered per browser, nothing more.
const TABS = ["board", "dialog"];
function showTab(name) {
  if (!TABS.includes(name)) name = "board";
  for (const t of TABS) $(t).hidden = t !== name;
  for (const b of document.querySelectorAll("#tabs button")) b.classList.toggle("on", b.dataset.tab === name);
  try { localStorage.setItem("ambrosio.tab", name); } catch {}
  return name;
}
$("tabs").addEventListener("click", (e) => {
  const b = e.target.closest("[data-tab]");
  if (b) showTab(b.dataset.tab);
});
try { showTab(localStorage.getItem("ambrosio.tab") || "board"); } catch { showTab("board"); }
$("say-send").addEventListener("click", () => sayToAmbrosio($("say").value));
$("say").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) sayToAmbrosio($("say").value);
});
$("standing").addEventListener("click", (e) => {
  const b = e.target.closest("[data-retire]");
  if (b) retireInstruction(b.dataset.retire);
});
$("ask").addEventListener("keydown", (e) => {
  if (e.key === "Enter") askAbout($("ask").value.trim(), selected || undefined);
});

// --- right-click a worker to ask about that worker -------------------------

const CANNED = [
  "What is it doing right now?",
  "Is it stuck?",
  "What is left before this can be accepted?",
  "What has it changed so far?",
];

function closeMenu() { $("menu").hidden = true; }

function openMenu(x, y, ticket) {
  const m = $("menu");
  m.innerHTML = `<div class="head">${esc(ticket)}</div>` +
    CANNED.map((q) => `<button data-q="${esc(q)}">${esc(q)}</button>`).join("") +
    `<hr><button data-act="type">Ask something else…</button>` +
    `<button data-act="open">Open its activity</button>`;
  m.dataset.ticket = ticket;
  m.hidden = false;
  // Keep it on screen when the card is near an edge.
  const r = m.getBoundingClientRect();
  m.style.left = Math.min(x, window.innerWidth - r.width - 8) + "px";
  m.style.top = Math.min(y, window.innerHeight - r.height - 8) + "px";
}

$("workers").addEventListener("contextmenu", (e) => {
  const card = e.target.closest(".card[data-id]");
  if (!card) return;
  e.preventDefault();
  openMenu(e.clientX, e.clientY, card.dataset.id);
});

$("menu").addEventListener("click", (e) => {
  const btn = e.target.closest("button");
  if (!btn) return;
  const ticket = $("menu").dataset.ticket;
  closeMenu();
  if (btn.dataset.q) return askAbout(btn.dataset.q, ticket);
  if (btn.dataset.act === "open") return openWorker(ticket);
  if (btn.dataset.act === "type") {
    selected = ticket;                 // scope the box to this worker
    $("ask").placeholder = `ask about ${ticket}…`;
    $("ask").focus();
  }
});

document.addEventListener("click", (e) => { if (!e.target.closest("#menu")) closeMenu(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeMenu(); });

async function poll() {
  try {
    const r = await fetch("/api/board");
    const d = await r.json();
    if (d.error) throw new Error(d.error);
    $("stale").innerHTML = d.version === UI_VERSION ? "" :
      '<div class="panel" id="stale-banner">This page is newer than the server it is talking to, ' +
      'so some of it will not work. Restart it: <b>bin/ambrosio ui</b></div>';
    render(d);
    // After hours, the night shift look takes precedence over "all quiet".
    if (d.afterHours && !d.workers.some((w) => w.state === "failed") && d.questions.length + d.plans.length + d.accept.length === 0) {
      const n = d.workers.filter((w) => w.state === "working").length;
      butler.setMood("night", n ? `after hours · ${n} running` : "after hours");
    } else {
      butler.setMoodFromBoard(d);
    }
    $("live").className = "";
    $("live").textContent = "updated " + new Date().toLocaleTimeString();
    loadDetail();
  } catch (e) {
    // Say so loudly: a frozen board that looks calm is the failure mode to avoid.
    $("live").className = "stale";
    $("live").textContent = "stale — " + e.message;
  }
}

poll();
setInterval(poll, 3000);
</script>
